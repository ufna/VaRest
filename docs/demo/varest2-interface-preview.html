 {id:107,type:'http',time:'14:32:08.421',method:'GET',path:'/v1/players/42',status:200,size:842,ms:64,scope:'PIE · GameInstance 1',body:player},
 {id:106,type:'http',time:'14:32:07.912',method:'POST',path:'/v1/session',status:200,size:328,ms:112,scope:'PIE · GameInstance 1',body:{sessionId:'demo-session-8d2f',accessToken:'[REDACTED]',expiresIn:3600}},
 {id:105,type:'ws',time:'14:32:07.208',method:'WS',path:'/realtime · player:joined',status:101,size:96,ms:3,scope:'PIE · Socket 3',body:{event:'player:joined',playerId:42,room:'lobby-eu-1'}},
 {id:104,type:'http',time:'14:32:06.834',method:'GET',path:'/v1/inventory',status:200,size:1640,ms:123,scope:'PIE · GameInstance 1',body:{coins:1250,items:[{id:'sword-01',rarity:'rare',level:12},{id:'potion-04',rarity:'common',count:6}]}},

 {id:102,type:'sio',time:'14:32:04.991',method:'SIO',path:'/game · inventory:update',status:200,size:144,ms:18,scope:'PIE · Namespace /game',body:{event:'inventory:update',args:[{coins:1250}],ackId:7,ack:{ok:true}}},
 {id:101,type:'http',time:'14:32:04.085',method:'POST',path:'/v1/telemetry',status:202,size:64,ms:31,scope:'Editor · Engine Hub',body:{accepted:true,batchId:'demo-b42'}}
 ];}
let state;let timers=[];let requestBusy=false;let toastTimer;
function reset(){timers.forEach(clearTimeout);timers=[];requestBusy=false;state={view:'inspector',traffic:initialTraffic(),selected:107,detail:'body',capture:true,query:'',kind:'all',endpoint:0,assetTab:'overview',environment:'Local',base:'http://127.0.0.1:8080',auth:'Bearer',requestPath:'/v1/players/42',requestMethod:'GET',requestBody:pretty({displayName:'Alex Mercer'}),response:null,responseStatus:200,selectedOps:new Set([0,1,2]),imported:false,fileName:'PlayerBackend.openapi.json',customOps:null,ws:false,wsLog:[{dir:'sys',text:'Демосоединение готово к подключению.'}],sio:false,sioLog:[{dir:'sys',text:'Namespace /game · ждёт подключения'}],bodyCapture:false,redact:true,rule:'camelCase',node:'Call Endpoint',graphPlayed:false,assetEndpoints:endpoints.map(x=>({...x}))};render();}

function render(){document.querySelectorAll('[data-view]').forEach(b=>{const on=b.dataset.view===state.view;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false');});$('#breadcrumb').textContent=names[state.view];$('#traffic-count').textContent=state.traffic.length;$('#endpoint-count').textContent=state.assetEndpoints.length;$('#content').innerHTML=({inspector,api,request,blueprint,openapi,websocket,sio,settings}[state.view])()+footer();}
function trafficRows(){const q=state.query.toLowerCase();return state.traffic.filter(r=>(state.kind==='all'||r.type===state.kind)&&(r.path+' '+r.method+' '+r.status+' '+r.scope).toLowerCase().includes(q));}
function inspector(){const rows=trafficRows();const r=state.traffic.find(x=>x.id===state.selected);return title('inspector','HTTP, WebSocket и Socket.IO в одном потоке. Выберите строку, чтобы посмотреть детали.',`<span class="row muted" style="font-size:11px">Capture <button class="switch ${state.capture?'on':''}" data-action="capture" aria-label="Переключить демозахват" aria-pressed="${state.capture}"></button></span><button class="primary" data-action="add-traffic">+ Demo request</button>`)+
 `<div class="grid four" style="margin-bottom:19px">${metric('Captured events',state.traffic.length,'Текущая демосессия')}${metric('Successful HTTP',state.traffic.filter(x=>x.type==='http'&&x.status<400).length,'Responses 2xx')}${metric('Median latency','64 ms','Иллюстративное значение')}${metric('Retained payload','3.2 KB','Пример ограниченного захвата')}</div>
 <div class="split-inspector"><div class="card"><div class="toolbar"><input class="search" id="traffic-search" placeholder="Filter URL, method, status…" aria-label="Фильтр запросов" value="${esc(state.query)}"><select id="traffic-kind" aria-label="Тип трафика">${[['all','All traffic'],['http','HTTP'],['ws','WebSocket'],['sio','Socket.IO']].map(([v,n])=>`<option value="${v}" ${state.kind===v?'selected':''}>${n}</option>`).join('')}</select><button class="compact ghost" data-action="clear-traffic">Clear</button></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Method / resource</th><th>Status</th><th>Size</th><th>Duration</th></tr></thead><tbody>${rows.map(x=>`<tr class="clickable ${x.id===state.selected?'selected':''}" data-traffic-id="${x.id}" tabindex="0"><td class="mono muted">${esc(x.time.slice(0,8))}<br><small>.${esc(x.time.slice(9))}</small></td><td>${method(x.method)}<span class="path">${esc(x.path)}</span><div class="muted" style="font-size:10px;margin-top:4px">${esc(x.scope)}</div></td><td class="status ${x.status>=400?'fail':'ok'}">${x.status}</td><td class="mono muted">${x.size} B</td><td class="mono">${x.ms} ms<div class="tiny-bar"><i style="width:${Math.min(100,x.ms/1.4)}%"></i></div></td></tr>`).join('')}</tbody></table>${rows.length?'':`<div class="empty">Нет событий под выбранным фильтром.</div>`}</div><div class="graph-caption">${rows.length} visible · ${state.traffic.length} retained · ${state.capture?'capture enabled':'capture paused'} · демоданные</div></div>
 <div class="card detail-card">${r?detail(r):'<div class="empty">Выберите событие. Кнопка Demo request добавит новое.</div>'}</div></div>`;}
function detail(r){let body='';if(state.detail==='body')body=`<div class="row spread" style="margin-bottom:12px"><span class="section-label" style="margin:0">Response body · JSON</span><button class="compact" data-action="copy-body">Copy</button></div><div class="code-box">${code(r.body)}</div><div class="notice" style="margin-top:15px">Значения Authorization / accessToken в примере скрыты. Здесь показаны только вымышленные данные.</div>`;
 if(state.detail==='overview')body=`<dl class="kv"><dt>Request ID</dt><dd class="mono">${r.id}</dd><dt>Scope</dt><dd>${esc(r.scope)}</dd><dt>Transport</dt><dd>${esc(r.type.toUpperCase())}</dd><dt>Result</dt><dd class="status ${r.status>=400?'fail':'ok'}">${r.status>=400?'Error':'Success'} · ${r.status}</dd><dt>Attempt</dt><dd>1 / 3</dd><dt>Duration</dt><dd>${r.ms} ms · demo</dd><dt>Cache</dt><dd>Network / miss</dd><dt>Endpoint</dt><dd>${esc(r.path.includes('players')?'GetPlayer':'Demo endpoint')}</dd></dl>`;
 if(state.detail==='headers')body=`<div class="section-label">Request headers</div><div class="code-box">${code({'Accept':'application/json','Authorization':'Bearer [REDACTED]','X-Request-Id':'demo-'+r.id})}</div><div class="section-label" style="margin-top:20px">Response headers</div><div class="code-box">${code({'Content-Type':'application/json; charset=utf-8','Cache-Control':'private, max-age=30','X-Region':'eu-west'})}</div>`;
 if(state.detail==='timing')body=`<div class="notice">Иллюстрация фаз, а не измерение реальной сети.</div>${[['Queue',4,8],['DNS',6,12],['Connect',11,25],['TLS',14,33],['Waiting',22,70],['Download',7,18]].map(([n,t,w],j)=>`<div class="timing-row"><span class="muted">${n}</span><div class="timing-track"><div class="timing-fill" style="width:${w}%;background:${j===4?'var(--accent)':'var(--blue)'}"></div></div><span class="mono right">${t}ms</span></div>`).join('')}`;
 return `<div class="detail-summary"><div class="row spread"><div>${method(r.method)} ${badge(r.status+' '+(r.status>=400?'Not Found':'OK'),r.status>=400?'red':'green')}</div><span class="mono muted">#${r.id}</span></div><div class="detail-url mono">${esc(state.base+r.path)}</div></div>${tabs([['overview','Overview'],['headers','Headers'],['body','Body'],['timing','Timing']],state.detail,'detail')}<div class="card-body">${body}</div>`;}
function api(){const eps=state.assetEndpoints,e=eps[state.endpoint];let right='';if(state.assetTab==='overview')right=`<div class="section-label">Endpoint identity</div><div class="field-grid"><label>Name<input readonly value="${esc(e.name)}"></label><label>Method<input readonly value="${esc(e.method)}"></label><label class="wide">Path template<input readonly class="mono" value="${esc(e.path)}"></label><label class="wide">Description<input readonly value="${esc(e.description)}"></label></div><div class="separator"></div><dl class="kv"><dt>GUID</dt><dd class="mono">73b122a9-8f5d-4af6-90e1-000000000042</dd><dt>Response type</dt><dd>${badge(e.type,'blue')}</dd><dt>Content type</dt><dd class="mono">application/json</dd><dt>Retry</dt><dd>3 attempts · exponential backoff</dd><dt>Cache</dt><dd>Memory · 30 seconds</dd></dl>`;
 if(state.assetTab==='environment')right=`<div class="notice" style="margin-bottom:18px">Изменения действуют только внутри этой HTML-демонстрации.</div><div class="field-grid"><label>Environment<select id="environment"><option ${state.environment==='Local'?'selected':''}>Local</option><option ${state.environment==='Staging'?'selected':''}>Staging</option></select></label><label>Timeout<input value="30 s" readonly></label><label class="wide">Base URL<input id="base-url" value="${esc(state.base)}"></label></div><div class="separator"></div><h3>Environment headers</h3><dl class="kv"><dt class="mono">Accept</dt><dd class="mono">application/json</dd><dt class="mono">X-Environment</dt><dd>${esc(state.environment.toLowerCase())}</dd></dl><button class="primary" data-action="save-environment">Apply to demo</button>`;
 if(state.assetTab==='auth')right=`<label>Provider<select id="auth-provider">${['None','Bearer','API Key','Basic','OAuth Client Credentials'].map(x=>`<option ${state.auth===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="separator"></div><div class="field-grid"><label class="wide">${state.auth==='OAuth Client Credentials'?'Token endpoint':'Session credential'}<input readonly class="auth-sample" value="${state.auth==='None'?'Anonymous':state.auth==='OAuth Client Credentials'?'https://auth.example.invalid/oauth/token':'••••••••••••••••••••••••'}"></label><label>Identity scope<input readonly value="player-demo-42"></label><label>Refresh state<input readonly value="Idle / demo"></label></div><div class="notice amber" style="margin-top:18px">Секреты в макете вымышленные. Провайдеры здесь не создаются и токены не запрашиваются.</div>`;
 if(state.assetTab==='types')right=`<div class="row spread"><h3>${esc(e.type)}</h3>${badge('Generated type','violet')}</div><div class="separator"></div><table><thead><tr><th>Field</th><th>Type</th><th>Wire key</th></tr></thead><tbody>${[['Id','int32','id'],['DisplayName','FString','displayName'],['Level','int32','level'],['Online','bool','online'],['Region','FString','region']].map(x=>`<tr><td>${x[0]}</td><td class="mono muted">${x[1]}</td><td class="mono">${x[2]}</td></tr>`).join('')}</tbody></table><div class="notice" style="margin-top:18px">Пример отображения struct ↔ JSON mappings. Переименование в этом макете не меняет Unreal assets.</div>`;
 return title('api','PlayerBackend · /Game/Backend/PlayerBackend',`${badge('API ASSET','blue')}<button data-view="request">↗ Try request</button>`)+`<div class="grid two"><div class="stack"><div class="card"><div class="card-head"><h2>Endpoints</h2>${badge(eps.length+' entries')}</div>${eps.map((x,j)=>`<div class="endpoint ${state.endpoint===j?'active':''}" data-endpoint="${j}" tabindex="0">${method(x.method)}<div><div class="endpoint-name">${esc(x.name)}</div><div class="endpoint-path mono">${esc(x.path)}</div></div><span class="muted" style="margin-left:auto">›</span></div>`).join('')}</div><div class="card card-body"><div class="section-label">Asset summary</div><div class="chips">${badge(state.environment,'green')}${badge('GUID-backed identity')}${badge('2 structs · 1 enum','violet')}</div><p class="muted" style="font-size:11px;margin-top:12px">Endpoint configuration, types, environment and auth are grouped in one API asset.</p></div></div><div class="card"><div class="card-head"><h2>${esc(e.name)}</h2>${method(e.method)}</div>${tabs([['overview','Overview'],['environment','Environment'],['auth','Auth'],['types','Types & rules']],state.assetTab,'assetTab')}<div class="card-body">${right}</div></div></div>`;}
function request(){return title('request','Соберите запрос и отправьте его в локальную симуляцию.',`${badge('NO NETWORK','amber')}`)+`<div class="grid equal"><div class="card"><div class="card-head"><h2>Request builder</h2>${badge(state.environment,'green')}</div><div class="card-body stack"><div class="request-line"><select id="request-method" aria-label="HTTP method">${['GET','POST','PATCH','PUT','DELETE'].map(x=>`<option ${state.requestMethod===x?'selected':''}>${x}</option>`).join('')}</select><input id="request-path" class="mono" aria-label="Request path" value="${esc(state.requestPath)}"></div><p class="muted mono" style="font-size:10px">Base: ${esc(state.base)}</p><div class="section-label" style="margin:0">Headers</div><label class="check-line"><input type="checkbox" checked>Accept: application/json</label><label class="check-line"><input type="checkbox" checked>Authorization: Bearer [REDACTED]</label><label>Body · JSON<textarea id="request-body">${esc(state.requestBody)}</textarea></label><div class="row spread"><button class="primary" data-action="send-request" ${requestBusy?'disabled':''}>${requestBusy?'◌ Sending demo…':'↗ Send demo request'}</button><button class="compact ghost" data-action="request-error">Try error response</button></div></div></div><div class="card"><div class="card-head"><h2>Response</h2>${state.response?badge(state.responseStatus+' '+(state.responseStatus>=400?'Error':'OK'),state.responseStatus>=400?'red':'green'):badge('Ready')}</div><div class="card-body">${state.response?`<div class="row spread muted" style="font-size:11px;margin-bottom:15px"><span>application/json</span><span>72 ms · simulated</span></div><div class="code-box">${code(state.response)}</div><div class="row" style="margin-top:16px"><button data-view="inspector">Open in Inspector →</button></div>`:`<div class="empty"><div style="font-size:35px;color:var(--accent);margin-bottom:15px">↗</div>Отправьте демозапрос.<br>Результат появится здесь и в Inspector.</div>`}</div> te.selectedOps.size} selected operations</dd><dt>Type policy</dt><dd>Generate structs / enum · demo</dd><dt>Local edits</dt><dd>Preserve compatible fields</dd><dt>Diagnostics</dt><dd>0 errors · illustrative plan</dd></dl><button class="primary" data-action="import" style="width:100%;margin-top:20px" ${state.selectedOps.size?'':'disabled'}>Apply selected in demo</button></div></div><div class="card card-body"><div class="section-label">Generated declarations · example</div><div class="tree">▾ PlayerBackend<br><div class="indent">▧ Api / PlayerBackend<br>▧ Types / PlayerProfile<br>▧ Types / Inventory<br>◇ Enums / ItemRarity<br>≡ ImportState / source mapping</div></div></div></div></div><div class="notice amber" style="margin-top:16px">Apply обновляет только состояние этой страницы. Пакеты Unreal не создаются и на диск проекта не записываются.</div>`;}

function nextId(){return Math.max(100,...state.traffic.map(x=>x.id))+1;}
function timeText(){return new Date().toLocaleTimeString('ru-RU',{hour12:false})+'.000';}
function sendRequest(graph=false){if(requestBusy)return;if(state.view==='request'){state.requestPath=$('#request-path').value;state.requestMethod=$('#request-method').value;state.requestBody=$('#request-body').value;}let input=null;try{if(state.requestBody.trim())input=JSON.parse(state.requestBody);}catch(e){toast('Body: некорректный JSON. Проверьте текст.');return;}requestBusy=true;if(state.view==='request')render();later(()=>{const bad=state.requestPath.includes('/fail');const body=bad?{error:{code:'NotFound',message:'Демонстрационный ответ404',retryable:false}}:state.requestMethod==='GET'?player:{ok:true,playerId:42,received:input};state.response=body;state.responseStatus=bad?404:200;requestBusy=false;addTraffic({id:nextId(),type:'http',time:timeText(),method:state.requestMethod,path:state.requestPath,status:state.responseStatus,size:JSON.stringify(body).length,ms:72,scope:'HTML demo · simulated',body});if(graph)state.graphPlayed=true;render();toast(graph?'Демограф выполнен: Hello, Alex Mercer':'Демоответ готов'+(state.capture?' · добавлен в Inspector':' · capture paused'));},650);}
document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;location.hash=state.view;render();return;}const tab=e.target.closest('[data-tab]');if(tab){state[tab.dataset.tab]=tab.dataset.value;render();return;}const traffic=e.target.closest('[data-traffic-id]');if(traffic){state.selected=Number(traffic.dataset.trafficId);render();return;}const ep=e.target.closest('[data-endpoint]');if(ep){state.endpoint=Number(ep.dataset.endpoint);render();return;}const node=e.target.closest('[data-node]');if(node){state.node=node.dataset.node;render();return;}const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action;
 if(a==='reset'){reset();toast('Демоданные восстановлены');}
 if(a==='capture'){state.capture=!state.capture;render();}
 if(a==='body-capture'){state.bodyCapture=!state.bodyCapture;render();}
 if(a==='redact'){state.redact=!state.redact;render();toast('В примере значения всё равно остаются скрытыми');}
 if(a==='clear-traffic'){state.traffic=[];state.selected=null;render();}
 if(a==='add-traffic'){if(!state.capture){toast('Включите Capture, чтобы добавить событие');return;}addTraffic({id:nextId(),type:'http',time:timeText(),method:'GET',path:'/v1/players/42',status:200,size:842,ms:48,scope:'HTML demo · simulated',body:player});render();}
 if(a==='copy-body'){const r=state.traffic.find(x=>x.id===state.selected);if(!r)return;if(navigator.clipboard)navigator.clipboard.writeText(pretty(r.body)).then(()=>toast('JSON скопирован')).catch(()=>toast('Браузер не разрешил clipboard; выделите JSON вручную'));else toast('Clipboard недоступен; выделите JSON вручную');}
 if(a==='save-environment'){state.base=$('#base-url').value;toast('Base URL изменён только в демо');}
 if(a==='send-request')sendRequest();
 if(a==='request-error'){state.requestPath='/fail/matches';state.requestMethod='GET';render();sendRequest();}
 if(a==='play-graph'){state.requestPath='/v1/players/42';state.requestMethod='GET';sendRequest(true);}
 if(a==='choose-file')$('#openapi-file').click();
 if(a==='import'){const ops=state.customOps||operations;state.assetEndpoints=ops.filter((_,i)=>state.selectedOps.has(i)).map(o=>({name:o.id,method:o.method,path:o.path,type:o.type==='No content'?'void':'F'+o.type,description:'Imported operation · HTML demo only'}));state.endpoint=0;state.imported=true;toast(`${state.selectedOps.size} операций применено в демосостоянии страницы`);render();}
 if(a==='save-settings')toast('Настройки применены к макету. Файлы проекта не изменены.');
 if(a==='ws-connect'){state.ws=!state.ws;state.wsLog.push({dir:'sys',text:state.ws?'Demo connected · protocol ready':'Demo disconnected · session closed'});render();}
 if(a==='ws-send'){const text=$('#ws-message').value;state.wsLog.push({dir:'out',text});state.wsLog.push({dir:'in',text:'{"event":"player:ready:ack","ok":true}'});addTraffic({id:nextId(),type:'ws',time:timeText(),method:'WS',path:'/realtime · message',status:101,size:text.length,ms:3,scope:'HTML demo · socket',body:{sent:text,ack:{ok:true}}});render();}
 if(a==='ws-ping'){state.wsLog.push({dir:'out',text:'PING · demo'});state.wsLog.push({dir:'in',text:'PONG · 3ms · demo'});render();}
 if(a==='sio-connect'){state.sio=!state.sio;state.sioLog.push({dir:'sys',text:state.sio?'Demo namespace connected':'Demo namespace disconnected'});render();}
 if(a==='sio-emit'){let args;try{args=JSON.parse($('#sio-args').value);}catch(err){toast('Arguments должны содержать корректный JSON');return;}const name=$('#sio-event').value,ns=$('#sio-namespace').value,ack=$('#sio-ack').checked;state.sioLog.push({dir:'out',text:`${ns} · ${name} ${JSON.stringify(args)}`});if(ack)state.sioLog.push({dir:'in',text:'ACK #7 {"ok":true} · demo'});addTraffic({id:nextId(),type:'sio',time:timeText(),method:'SIO',path:ns+' · '+name,status:200,size:JSON.stringify(args).length,ms:18,scope:'HTML demo · namespace',body:{namespace:ns,event:name,args,ack:ack?{id:7,ok:true}:null}});render();}
});
document.addEventListener('input',e=>{if(e.target.id==='request-body')state.requestBody=e.target.value;if(e.target.id==='request-path')state.requestPath=e.target.value;if(e.target.id==='traffic-search'){const pos=e.target.selectionStart;state.query=e.target.value;render();$('#traffic-search').focus();$('#traffic-search').setSelectionRange(pos,pos);}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='request-method')state.requestMethod=t.value;if(t.id==='traffic-kind'){state.kind=t.value;render();}if(t.id==='environment'){state.environment=t.value;state.base=t.value==='Local'?'http://127.0.0.1:8080':'https://api.example.invalid';render();}if(t.id==='auth-provider'){state.auth=t.value;render();}if(t.id==='naming-rule'){state.rule=t.value;render();}if(t.dataset.op!==undefined){const id=Number(t.dataset.op);if(t.checked)state.selectedOps.add(id);else state.selectedOps.delete(id);state.imported=false;render();}if(t.id==='openapi-file'&&t.files[0]){const file=t.files[0];if(file.size>1024*1024){toast('Для демо выберите JSON меньше1MB');return;}try{const parsed=JSON.parse(await file.text());if(!parsed.openapi||!parsed.paths)throw Error('Ожидается OpenAPI3 с paths');const ops=[];for(const [path,v]of Object.entries(parsed.paths)){for(const m of ['get','post','put','patch','delete','head','options'])if(v&&v[m])ops.push({id:v[m].operationId||m+' '+path,method:m.toUpperCase(),path,type:'From selected document'});}if(!ops.length)throw Error('Операции не найдены');if(ops.length>200)throw Error('Демо ограничено200 операциями');state.customOps=ops;state.selectedOps=new Set(ops.map((_,i)=>i));state.fileName=file.name;state.imported=false;render();toast('JSON прочитан локально, без отправки');}catch(err){toast('JSON: '+err.message);}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-traffic-id],[data-endpoint]'))e.target.click();});
reset();
if(names[location.hash.slice(1)]){state.view=location.hash.slice(1);render();}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(names[v]&&v!==state.view){state.view=v;render();}});
</script>
</body>
</html>
